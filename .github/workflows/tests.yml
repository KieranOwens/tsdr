name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install tsdr with its test dependencies
        run: python -m pip install -e ".[test]"
      - name: Run the tests
        run: |
          set -o pipefail
          python -m pip list | grep -iE "numpy|scipy|scikit|pywavelets|kneed|pandas|pytest"
          python -m pytest -rfE --tb=line -q 2>&1 | tee pytest.log || status=$?
          grep -E "^(FAILED|ERROR) " pytest.log | while read -r line; do echo "::error::$line"; done
          grep -E "^E  |Error:" pytest.log | head -20 | while read -r line; do echo "::warning::$line"; done
          python -m pip list | grep -iE "numpy|scipy|scikit" | tr '\n' ' ' | sed 's/^/::notice::/'; echo
          exit ${status:-0}
